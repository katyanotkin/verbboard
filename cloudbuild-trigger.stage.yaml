name: stage-release
description: release stage on push
# region is passed via --region=us-east1 flag on import, not a YAML field
filename: cloudbuild.stage.yaml
serviceAccount: projects/knotmem26/serviceAccounts/cloudbuild-deployer@knotmem26.iam.gserviceaccount.com

github:
  owner: katyanotkin
  name: verbboard
  push:
    branch: ^main$

# Skip the stage build for pushes that touch only files the image and the
# Hosting deploy never use. The image copies only pyproject.toml, uv.lock,
# app/ and core/ (Dockerfile); Hosting deploys public/ and firebase.json.
# Anything not listed here (Dockerfile, app/, core/, public/, pyproject.toml,
# uv.lock, firebase.json, cloudbuild*.yaml) still triggers a build.
ignoredFiles:
  - "*.md"
  - "**/*.md"
  - "*.txt"
  - "**/*.txt"
  - "*.log"
  - ".gitignore"
  - "LICENSE"
  - "docs/**"
  - ".claude/**"
  - "tests/**"
  - "tools/**"
  - "scripts/**"
  - "data_src/**"
  - "experiments/**"
  - "drafts/**"
  - "runtime/**"
  - "Makefile"
  - "pytest.ini"
  - ".pre-commit-config.yaml"
  - ".env.sample"
  - "firestore.rules"
  - "firestore.indexes.json"
  - "cloudbuild-trigger.stage.yaml"
