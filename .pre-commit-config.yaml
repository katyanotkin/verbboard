fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: ["--ignore-missing-imports"]

  - repo: local
    hooks:
      - id: python-compile
        name: Python syntax check
        entry: .venv/bin/python -m py_compile
        language: system
        types: [python]

      - id: check-template
        name: Validate board template
        entry: .venv/bin/python tools/check_template.py
        language: system
        pass_filenames: false

      - id: check-plugins
        name: Validate language plugins
        entry: .venv/bin/python tools/check_plugins.py
        language: system
        pass_filenames: false

      - id: pytest-all
        name: pytest all regression tests
        entry: tools/run_pytest_hook.sh
        language: system
        pass_filenames: false
        files: \.(py|js|css|html|json)$
