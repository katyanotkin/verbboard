<!doctype html>
<html lang="{{ ui_lang }}" dir="{{ html_dir }}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title>{{ ui['verbs.title'] }}</title>

  <link rel="stylesheet" href="/static/common.css"/>
  <link rel="stylesheet" href="/static/verbs.css"/>
</head>
<body>
  <div class="vb-page">

    <div class="vb-header page-header">
      <a
        href="/?language={{ selected_language }}"
        class="vb-back"
      >
        {{ ui['verbs.back_home'] }}
      </a>

      <h1 class="vb-title">
        {{ ui['verbs.heading'] }}
      </h1>

      <div class="vb-header-right">
        <a
          href="/feedback?page=verbs&language={{ selected_language }}&return_to=/verbs?language={{ selected_language }}"
          class="feedback-link"
          title="{{ ui['verbs.feedback_title'] }}"
        >
          {{ ui['verbs.feedback_link'] }}
        </a>

        <div id="auth-slot" class="auth-slot"></div>
      </div>
    </div>

    <div class="vb-filter-row">
      <div class="vb-filter-toggle" id="vb-filter-toggle">
        <button
          type="button"
          class="vb-ftbtn active"
          data-filter="new"
        >
          {{ ui['verbs.filter_new'] }}
        </button>

        <button
          type="button"
          class="vb-ftbtn"
          data-filter="seen"
        >
          {{ ui['verbs.filter_seen'] }}
        </button>

        <button
          type="button"
          class="vb-ftbtn"
          data-filter="all"
        >
          {{ ui['verbs.filter_all'] }}
        </button>

        <button
          type="button"
          class="vb-ftbtn"
          data-filter="known"
        >
          {{ ui['verbs.filter_known'] }}
        </button>
      </div>
    </div>

    <form
      action="/search_verb"
      method="get"
      class="vb-toolbar"
    >
      <input
        type="hidden"
        name="language"
        value="{{ selected_language }}"
      />

      <div class="vb-search-row">
        <input
          id="vb-search"
          name="q"
          class="vb-search"
          type="text"
          placeholder="{{ ui['verbs.search_placeholder'] }}"
          autocomplete="off"
        />

        <button
          type="submit"
          class="vb-search-submit"
        >
          {{ ui['verbs.find_button'] }}
        </button>
      </div>
    </form>

    <div class="vb-toolbar-meta">
      <select id="vb-sort" class="vb-sort-select">
        <option value="rank">
          {{ ui['verbs.sort_frequency'] }}
        </option>

        <option value="alpha">
          {{ sort_az_label }}
        </option>
      </select>

      <span class="vb-legend-known">
        <span class="vb-badge known">★</span>
        {{ ui['verbs.filter_known'] }}
      </span>

      <div class="progress-row">
        <div class="progress-bar">
          <div class="progress-fill" style="width:0%"></div>
        </div>

        <div class="progress-meta">
          <span class="progress-star">★</span>
          <span class="progress-count">0</span>
          <span class="progress-total"></span>
        </div>
      </div>
    </div>

    {% if practice_loop_enabled %}
    <div id="practice-panel" class="practice-panel"></div>
    {% endif %}

    <div id="vb-list" class="vb-list"></div>

  </div>

  <script>
    window.FIREBASE_WEB_CONFIG = {{ firebase_web_config_json | safe }};
  </script>

  <script>
    window.VB_LANGUAGE = {{ lang_json | safe }};
    window.VB_VERBS = {{ verbs_json | safe }};
    window.VB_RECENT_IDS = {{ recent_json | safe }};
    window.UI = {{ ui_json | safe }};
  </script>

  <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth-compat.js"></script>

  <script defer src="/static/auth.js"></script>

  <script src="/static/storage.js"></script>
  <script src="/static/verbs_filters.js"></script>
  <script src="/static/practice_loop.js"></script>
  <script src="/static/verbs_page.js"></script>
</body>
</html>
