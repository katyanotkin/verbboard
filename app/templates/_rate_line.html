{# Android-only "rate us" line; unhidden by pwa.js. Expects rate_line_text, rate_link_label. #}
<p class="rate-line" id="rate-line" hidden>{{ rate_line_text }}
  <a id="rate-link" class="rate-link" rel="noopener"
     href="https://play.google.com/store/apps/details?id=com.verbboard.app&amp;referrer=utm_source%3Dverbboard_web%26utm_medium%3Drate_link">{{ rate_link_label }}</a></p>
