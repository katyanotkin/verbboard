<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reports admin</title>
  <link rel="stylesheet" href="/static/admin.css"/>
</head>
<body>
  <div
    id="admin-report-config"
    data-api-url="{{ admin_prefix }}/api/reports"
    data-default-from="{{ default_date_from }}"
    data-default-to="{{ default_date_to }}"
  ></div>

  <main class="admin-page">
    <div class="card card-toolbar">
      <a class="nav-item nav-item-tab" href="{{ admin_prefix }}/feedback">Feedback</a>
      <a class="nav-item nav-item-tab" href="{{ admin_prefix }}/#signals">Verb demand</a>
      <a class="nav-item nav-item-tab" href="{{ admin_prefix }}/#candidates">Candidates</a>
      <a class="nav-item nav-item-tab" href="{{ admin_prefix }}/entitlements">Entitlements</a>
      <a class="nav-item active nav-item-tab" href="{{ admin_prefix }}/reports">Reports</a>
      <a href="{{ admin_prefix }}" style="margin-left:auto;">Back to admin</a>
      <form method="post" action="{{ admin_prefix }}/logout" style="display:inline;">
        <button type="submit" style="border:none; background:none; color:inherit; font:inherit; cursor:pointer; padding:0; text-decoration:underline;">Log out</button>
      </form>
    </div>

    <h1>Play closed testing report</h1>
    <p class="text-muted">
      Counts are sessions (one per device and day), not people: the same tester on three days is three sessions.
      Percentages use non-bot sessions as the denominator.
    </p>

    <div class="card card-form">
      <div class="filters-grid">
        <div>
          <label for="report-from">From</label>
          <input id="report-from" type="date">
        </div>
        <div>
          <label for="report-to">To</label>
          <input id="report-to" type="date">
        </div>
        <div>
          <label for="report-since">Since (invite date)</label>
          <input id="report-since" type="date">
        </div>
        <div>
          <label><input id="report-compare" type="checkbox"> Compare to previous period</label>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-primary" data-preset="7">Last 7d</button>
        <button type="button" class="btn-primary" data-preset="30">Last 30d</button>
        <button type="button" class="btn-primary" data-preset="since">Since invite</button>
        <button type="button" class="btn-primary" id="report-run">Custom: run</button>
      </div>
    </div>

    <div id="report-error" class="error-msg" hidden></div>
    <div id="report-body"></div>
  </main>
  <script src="/static/admin_report.js"></script>
</body>
</html>
