<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerbBoard -- Offline</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    font-family: system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: #667085; max-width: 320px; }
  button {
    margin-top: 8px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #2d6a4f;
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <img src="/static/icons/icon-192x192.png" alt="">
  <h1>You're offline</h1>
  <p>VerbBoard needs a connection to load this page. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
