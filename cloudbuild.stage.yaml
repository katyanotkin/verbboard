steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/verbboard/verbboard:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/verbboard/verbboard:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - verbboard-stage
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/verbboard/verbboard:$COMMIT_SHA
      - --region=us-east1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=ENVIRONMENT=stage,EDITION=plus,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AUDIO_BUCKET=verbboard-audio-stage,VERB_SIGNALS_COLLECTION=demand_signal,VERB_SIGNAL_LABELS_COLLECTION=demand_signal_labels,VERBS_COLLECTION=verbs,LOG_LEVEL=INFO,JUMP_TO_EXAMPLE_ENABLED=false,ALLOW_LOCAL_DEV_AUTH=true
      - --set-secrets=FIREBASE_WEB_CONFIG_JSON=verbboard-firebase-web-config-stage:latest,ADMIN_SECRET=verbboard-admin-secret:latest,ANTHROPIC_API_KEY=verbboard-anthropic-api-key:latest,ANALYTICS_EXCLUDED_EMAILS=verbboard-analytics-excluded-emails:latest

  # Deploy Firebase Hosting static files (public/) to both verbboard.com and stage.verbboard.com.
  # Requires cloudbuild-deployer SA to have roles/firebasehosting.admin.
  - name: node:20-slim
    entrypoint: sh
    args:
      - '-c'
      - 'npx -y firebase-tools deploy --only hosting --project $PROJECT_ID --non-interactive'

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/verbboard/verbboard:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
