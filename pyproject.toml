[project]
name = "verbboard"
version = "0.1.0"
description = "Demand-driven verb learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.96.0",
    "edge-tts>=7.2.8",
    "fastapi>=0.136.1",
    "firebase-admin>=7.4.0",
    "google-cloud-aiplatform>=1.152.0",
    "google-cloud-firestore>=2.27.0",
    "google-cloud-secret-manager>=2.28.0",
    "google-cloud-storage>=3.10.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "playwright>=1.59.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.12",
    "types-requests>=2.33.0.20260508",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
